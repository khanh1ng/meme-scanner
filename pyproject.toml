[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "memescan"
version = "0.2.0"
description = "Point-in-time research pipeline for meme-stock ignitions, with the defects that broke the first backtest turned into tests"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "pyarrow>=12", "requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=7"]
notebooks = ["jupyter", "matplotlib", "scipy"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
memescan = ["hindsight_82.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
